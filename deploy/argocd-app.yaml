apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: altmgo-backend
  namespace: argocd
spec:
  project: altmgo-backend
  source:
    repoURL: https://github.com/MiguelRipoll23/altmgo.git
    targetRevision: main
    path: deploy
    helm:
      parameters:
        - name: image.tag
          value: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: altmgo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
