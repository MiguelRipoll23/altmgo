# altmgo-backend: the AltMGO API, in its own container.
#
# The site is deployed separately on Vercel and reaches this container at
# https://raspberrypi.tailbb45e2.ts.net:10000 through the Tailscale Funnel, so every call is cross-origin and carries the
# `/api` prefix the app routes.
#
# The image is built from the repository root
# (`docker build -t altmgo-backend:latest .`) and loaded into k3s's containerd,
# so it is referenced by a local tag and never pulled. The API listens on the
# container's port 9090 over plain HTTP.
#
# The Deployment reads a secret named altmgo-secrets with two keys:
#   DATABASE_URL  a standard postgresql:// URL (the game's Postgres)
#   JWT_SECRET    a value of this site's own, e.g. `openssl rand -hex 32`
# Create it before applying, for example:
#   kubectl -n altmgo create secret generic altmgo-secrets \
#     --from-literal=DATABASE_URL='postgresql://user:password@mgo2-postgres:5432/mgo2' \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: altmgo-backend
  namespace: altmgo
  labels:
    app: altmgo-backend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: altmgo-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: altmgo-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: altmgo-backend
          image: ghcr.io/miguelripoll23/altmgo-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          env:
            - name: PORT
              value: "9090"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: altmgo-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: altmgo-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
