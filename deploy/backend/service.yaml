apiVersion: v1
kind: Service
metadata:
  name: altmgo-backend
  namespace: altmgo
spec:
  type: LoadBalancer
  # Preserve the caller's address: the API publishes it for the player's game,
  # so a service that SNATs the connection would publish the node's address.
  externalTrafficPolicy: Local
  selector:
    app: altmgo-backend
  ports:
    - name: http
      port: 10000
      targetPort: http
      protocol: TCP
