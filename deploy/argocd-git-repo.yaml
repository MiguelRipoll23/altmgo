apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: altmgo-backend
  namespace: argocd
spec:
  description: AltMGO backend deployment project
  sourceRepos:
    - ssh://git@github.com/MiguelRipoll23/altmgo.git
  destinations:
    - namespace: altmgo
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ''
      kind: ResourceQuota
    - group: ''
      kind: LimitRange
    - group: admission.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admission.k8s.io
      kind: ValidatingWebhookConfiguration
